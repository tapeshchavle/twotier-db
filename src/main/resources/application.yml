spring:
  application:
    name: two-tier-db

  # ── PostgreSQL (Users, structured data) ──
  datasource:
    url: jdbc:postgresql://localhost:5432/twotierdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── MongoDB (Posts, document data) ──
  data:
    mongodb:
      uri: mongodb://localhost:27017/twotierdb

server:
  port: 8080
