spring:
  application:
    name: two-tier-db

  # ── PostgreSQL ──
  datasource:
    url: jdbc:postgresql://localhost:5432/twotierdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── MongoDB ──
  data:
    mongodb:
      uri: mongodb://localhost:27017/twotierdb

# ── Application Config ──
app:
  database:
    default-type: POSTGRES        # POSTGRES | MONGODB
    dual-write-enabled: false     # Write to both DBs simultaneously

server:
  port: 8080
